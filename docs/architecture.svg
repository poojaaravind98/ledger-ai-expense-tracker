<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="50" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">LEDGER AI EXPENSE TRACKER</text>
  <text x="50" y="80" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">System Architecture &amp; Multi-Agent Pipeline</text>

  <!-- Frontend Box -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="260" height="440" fill="#1F2937" rx="14" stroke="#374151" stroke-width="1.5"/>
    <rect width="260" height="48" fill="#111827" rx="14"/>
    <text x="20" y="30" fill="#818CF8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">React 19 Frontend</text>
    <text x="20" y="75" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Vite + TypeScript</text>
    <text x="20" y="105" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Tailwind CSS + Glassmorphism</text>
    <text x="20" y="135" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Recharts (Area, Donut, Bars)</text>
    <text x="20" y="165" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• TanStack React Query</text>
    <text x="20" y="195" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Framer Motion Animations</text>
    <text x="20" y="225" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Interactive RAG Chat UI</text>
    <text x="20" y="255" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• 3-Agent Stepper Visualizer</text>
    <text x="20" y="285" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Drag &amp; Drop Receipt OCR</text>
    <text x="20" y="315" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Dynamic Category Guardrails</text>
  </g>

  <!-- Backend Box -->
  <g transform="translate(370, 110)" filter="url(#shadow)">
    <rect width="260" height="440" fill="#1F2937" rx="14" stroke="#374151" stroke-width="1.5"/>
    <rect width="260" height="48" fill="#111827" rx="14"/>
    <text x="20" y="30" fill="#10B981" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Express + Node Server</text>
    <text x="20" y="75" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• REST API Gateway &amp; JWT</text>
    <text x="20" y="105" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Prisma ORM (PG / SQLite)</text>
    <text x="20" y="135" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Multer Document Uploads</text>
    <text x="20" y="165" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Zod Schema Validation</text>
    <text x="20" y="195" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Unified LLM Abstraction</text>
    <text x="20" y="225" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Document Text Chunking</text>
    <text x="20" y="255" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Vector Embeddings &amp; Search</text>
    <text x="20" y="285" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="12">• Heuristic Fallback Engine</text>
  </g>

  <!-- AI & Agents Box -->
  <g transform="translate(690, 110)" filter="url(#shadow)">
    <rect width="260" height="440" fill="#1F2937" rx="14" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect width="260" height="48" fill="url(#purpleGrad)" rx="14"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">AI Subsystem &amp; Agents</text>
    
    <!-- Step 1 -->
    <rect x="15" y="65" width="230" height="60" fill="#111827" rx="10" stroke="#6366F1" stroke-width="1"/>
    <text x="25" y="85" fill="#818CF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">STEP 1: Analysis Agent</text>
    <text x="25" y="105" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">Velocity, anomalies &amp; MoM trends</text>

    <!-- Arrow -->
    <path d="M 130 130 L 130 145" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <rect x="15" y="150" width="230" height="60" fill="#111827" rx="10" stroke="#A855F7" stroke-width="1"/>
    <text x="25" y="170" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">STEP 2: Budgeting Agent</text>
    <text x="25" y="190" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">50/30/20 &amp; Health Score (0-100)</text>

    <!-- Arrow -->
    <path d="M 130 215 L 130 230" stroke="#8B5CF6" stroke-width="2"/>

    <!-- Step 3 -->
    <rect x="15" y="235" width="230" height="60" fill="#111827" rx="10" stroke="#10B981" stroke-width="1"/>
    <text x="25" y="255" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">STEP 3: Recommendations Agent</text>
    <text x="25" y="275" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">Quick wins, subscription audit, tax</text>

    <!-- RAG Box -->
    <rect x="15" y="320" width="230" height="95" fill="#111827" rx="10" stroke="#06B6D4" stroke-width="1"/>
    <text x="25" y="340" fill="#22D3EE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">RAG Document VectorStore</text>
    <text x="25" y="360" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">• Auto OCR extraction</text>
    <text x="25" y="380" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">• Semantic Cosine Similarity</text>
    <text x="25" y="400" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">• Source Citation in Chat</text>
  </g>

  <!-- Connectors -->
  <line x1="310" y1="300" x2="370" y2="300" stroke="#6366F1" stroke-width="2" stroke-dasharray="4"/>
  <line x1="630" y1="300" x2="690" y2="300" stroke="#10B981" stroke-width="2" stroke-dasharray="4"/>
</svg>
